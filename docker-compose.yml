services:
  gws_mcp:
    build: .
    container_name: gws_mcp
    environment:
      - GOOGLE_MCP_CREDENTIALS_DIR=/app/store_creds
      - TOOL_TIER=complete
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
      - store_creds:/app/store_creds:rw
    env_file:
      - .env
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    networks:
      - mcp_net

  scheduler:
    image: alpine:latest
    container_name: gws_mcp_scheduler
    entrypoint: /bin/sh -c
    command: >
      "apk add --no-cache docker-cli &&
      echo '0 3 * * * docker restart gws_mcp' | crontab - &&
      crond -f"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gws_mcp
    restart: unless-stopped
    networks:
      - mcp_net

  nginx:
    image: nginx:alpine
    container_name: gws_mcp_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gws_mcp
    networks:
      - mcp_net

volumes:
  store_creds:

networks:
  mcp_net: